services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest # Fijen la versión que use la clase
    ports:
      - "127.0.0.1:5678:5678" # Solo en su máquina
    environment:
      GENERIC_TIMEZONE: America/Mexico_City
    volumes:
      - n8n_data:/home/node/.n8n # Flujos y credenciales cifradas
    depends_on:
      matrix-api:
        condition: service_healthy
 
volumes:
  n8n_data: